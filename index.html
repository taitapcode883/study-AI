<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Tracker – Tính điểm trung bình tích lũy</title>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>GPA Tracker</h1>
        <p class="subtitle">Tính điểm trung bình tích lũy hệ 4 và hệ 10</p>
      </header>

      <section class="card" aria-labelledby="summary-title">
        <h2 id="summary-title">Tổng kết</h2>
        <dl class="summary">
          <div class="stat"><dt>Tổng số môn</dt><dd id="sum-courses">—</dd></div>
          <div class="stat"><dt>Tổng tín chỉ</dt><dd id="sum-credits">—</dd></div>
          <div class="stat"><dt>Tín chỉ đạt</dt><dd id="sum-passed">—</dd></div>
          <div class="stat stat-main"><dt>GPA hệ 4</dt><dd id="sum-gpa4">—</dd></div>
          <div class="stat stat-main"><dt>GPA hệ 10</dt><dd id="sum-gpa10">—</dd></div>
          <div class="stat stat-main"><dt>Xếp loại</dt><dd id="sum-class">—</dd></div>
        </dl>
        <p class="hint" id="empty-hint">Hãy thêm môn học đầu tiên</p>
      </section>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Thêm môn học</h2>
        <form id="course-form" novalidate>
          <div class="field field-name">
            <label for="course-name">Tên môn</label>
            <input id="course-name" name="name" type="text" autocomplete="off"
              aria-describedby="error-name" />
            <p class="error" id="error-name" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="course-credits">Số tín chỉ</label>
            <input id="course-credits" name="credits" type="text" inputmode="numeric"
              autocomplete="off" aria-describedby="error-credits" />
            <p class="error" id="error-credits" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="course-grade">Điểm hệ 10</label>
            <input id="course-grade" name="grade" type="text" inputmode="decimal"
              autocomplete="off" placeholder="vd. 8,5" aria-describedby="error-grade" />
            <p class="error" id="error-grade" aria-live="polite"></p>
          </div>
          <button type="submit" id="submit-button">Thêm môn</button>
        </form>
      </section>

      <section class="card" aria-labelledby="table-title">
        <h2 id="table-title">Danh sách môn học</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">STT</th>
                <th scope="col">Tên môn</th>
                <th scope="col" class="num">Tín chỉ</th>
                <th scope="col" class="num">Điểm hệ 10</th>
                <th scope="col" class="num">Điểm chữ</th>
                <th scope="col" class="num">Hệ 4</th>
              </tr>
            </thead>
            <tbody id="course-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
